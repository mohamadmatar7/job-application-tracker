name: Keep Supabase Alive

on:
  schedule:
    - cron: "17 6,18 * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping application
        run: |
          curl --fail --silent --show-error \
            "https://mohamad-applications.vercel.app/nl" \
            > /dev/null